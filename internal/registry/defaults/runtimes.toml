# Inference backends. A runtime is a BINARY PATH, not a name
# (docs/DECISIONS.md D6) — several llama.cpp builds coexist here because
# PrismML's fork is required for Bonsai's Q1_0_g128 kernels and upstream
# llama.cpp cannot load that format at all.
#
# `managed = true` means something else owns the process lifecycle, so froe
# checks the endpoint rather than looking for a binary to launch.

[runtime.ollama]
kind     = "ollama"
base_url = "http://localhost:11434/v1"
grammar  = "no"            # Ollama does not expose GBNF
managed  = true
notes    = "num_ctx defaults to 4096 and SILENTLY TRUNCATES. Always set it explicitly."

[runtime.llamacpp]
kind     = "openai-compat"
base_url = "http://127.0.0.1:8080/v1"
grammar  = "yes"
managed  = true
serves_one = true          # llama-server holds the one model it was started with
prefix_reuse = true        # with one slot, a turn that extends the conversation reads only what is new
# Down when froe needs it: froe-llamacpp starts it (--jinja, --parallel 1,
# -c 32768, --fit sizing the GPU/CPU split) and returns once the model answers.
# The model's `path` is the GGUF file.
start    = ["froe-llamacpp", "--background", "--model", "{path}", "--model-id", "{model}", "--port", "{port}"]
notes    = "Upstream llama.cpp (MIT), github.com/ggml-org/llama.cpp. The default runtime. MEASURED 2026-11-06 on the reference laptop (RTX 4060 8 GB, 16 GB RAM), release b12169 with CUDA: Qwen3-Coder-30B-A3B Q4_K_M at ~31-35 tok/s generation and ~425 tok/s prompt reading, 24/30 on the eval in 15m13s at 32K (22/30 at 8K before a keep-alive fix) - the same GGUF on colibri scored 16/30 in 62m55s. Reports its window at /props."

[runtime.llamacpp-prismml]
kind     = "openai-compat"
binary   = "~/src/prismml-llama.cpp/build/bin/llama-server"
base_url = "http://localhost:8081/v1"
grammar  = "unverified"
notes    = "PrismML fork (github.com/PrismML-Eng/llama.cpp). OPEN: does it ship llama-server or only llama-cli? Does GBNF survive? How far behind upstream?"

[runtime.colibri]
kind     = "openai-compat"
base_url = "http://127.0.0.1:8000/v1"
grammar  = "no"            # its GBNF only drafts tokens for speed; it never constrains sampling
managed  = true
serves_one = true          # /v1/models lists the one model being served
prefix_reuse = true        # a turn that extends the held conversation reads only what is new
# Down when froe needs it: froe-colibri starts it (COLI_PARK=0, the GPU
# backend) and returns once the model answers. The model's `path` says where.
start    = ["froe-colibri", "--background", "--model", "{path}", "--model-id", "{model}", "--port", "{port}"]
notes    = "Open source (Apache 2.0), github.com/JustVugg/colibri. Start with: COLI_PARK=0 coli serve --model <dir> --model-id <runtime_id> --auto-tier --ctx 8192. COLI_PARK=0 matters: otherwise a new task shorter than the held conversation is treated as a side question, the old conversation is kept, and the new one is re-read on every turn. One model per server, so there is no load command and routing stays on the served model. Reports its window at /v1/models (context_length). Port 8000 is its default; move it with --port and a base_url overlay."

[runtime.mistral]
kind     = "openai-compat"
base_url = "https://api.mistral.ai/v1"
grammar  = "no"
managed  = true
api_key_env = "MISTRAL_API_KEY"
notes    = "EU-hosted and EU-governed."

[runtime.anthropic]
kind     = "anthropic"
base_url = "https://api.anthropic.com/v1"
grammar  = "no"
managed  = true
api_key_env = "ANTHROPIC_API_KEY"
notes    = "Own wire format, own adapter."
